const CATS=["Hamburguesas","Acompañamientos","Ensaladas","Postres","Bebida sin alcohol","Bebida con alcohol","Productos","Promos"];
let curCat="Hamburguesas", cart=[];
function show(v){
  ["home","menu","cart","admin"].forEach(x=>document.getElementById("view-"+x).classList.add("hidden"));
  document.getElementById("view-"+v).classList.remove("hidden");
  if(v==="menu") renderMenu(); if(v==="cart") renderCart();
  window.scrollTo(0,0);
}
function goCat(c){curCat=c; show("menu");}
function renderMenu(){
  document.getElementById("catTitle").innerText=curCat;
  document.getElementById("filters").innerHTML=CATS.map(c=>`<button class="${c===curCat?'active':''}" onclick="goCat('${c}')">${c}</button>`).join("");
  document.getElementById("list").innerHTML=MENU.filter(m=>m.cat===curCat).map(m=>`
    <div class="card"><img src="${m.img}"><div style="flex:1"><h3>${m.name}</h3><p>${m.desc}</p><div class="row"><span class="price">$${m.price.toLocaleString("es-AR")}</span><button class="add" onclick="add(${m.id})">Agregar</button></div></div></div>`).join("") || "<p style='padding:0 20px;opacity:.8'>Próximamente.</p>";
}
function add(id){let it=MENU.find(m=>m.id===id);let f=cart.find(c=>c.id===id); if(f) f.qty++; else cart.push({...it,qty:1}); alert(it.name+" agregado"); renderCart();}
function renderCart(){
  document.getElementById("cartCount").innerText=cart.reduce((a,c)=>a+c.qty,0);
  let total=cart.reduce((a,c)=>a+c.qty*c.price,0);
  document.getElementById("total").innerText="Total: $"+total.toLocaleString("es-AR");
  document.getElementById("cartList").innerHTML=cart.map(c=>`<div class="cart-item"><span>${c.qty} x ${c.name}</span><b>$${(c.qty*c.price).toLocaleString("es-AR")}</b></div>`).join("") || "<p style='padding:0 20px'>Tu carrito está vacío.</p>";
}
function sendOrder(){
  if(!cart.length) return alert("Agregá algo primero");
  let total=cart.reduce((a,c)=>a+c.qty*c.price,0);
  let msg=`Hola CARNE! Quiero pedir:%0A`+cart.map(c=>`- ${c.qty} x ${c.name} $${(c.qty*c.price).toLocaleString("es-AR")}`).join("%0A")+`%0A%0ATotal: $${total.toLocaleString("es-AR")}%0ANombre: ${document.getElementById("custName").value}%0A${document.getElementById("custType").value}: ${document.getElementById("custAddr").value}`;
  window.open(`https://wa.me/${WA}?text=${msg}`,"_blank");
}
function previewCamp(){
  let p=document.getElementById("preview"); p.style.display="block";
  p.innerHTML=`<b>${document.getElementById("campTitle").value}</b><p style="margin:6px 0">${document.getElementById("campMsg").value}</p><small>Para: ${document.getElementById("aud").value} • Desde: CARNE</small>`;
}
function sendCamp(){
  previewCamp();
  let msg=encodeURIComponent(document.getElementById("campTitle").value+"\n"+document.getElementById("campMsg").value+"\n\nPedí acá: https://wa.me/"+WA);
  document.getElementById("campLog").innerText="Campaña lista para probar.";
  window.open(`https://wa.me/${WA}?text=${msg}`,"_blank");
}
