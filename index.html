<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARNE - La Plata</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#000;color:#fff;padding:16px;padding-bottom:120px}
header{text-align:center;padding:10px 0 18px}
h1{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:0.9}
.sub{color:#999;font-size:14px;margin-top:6px}
h2{font-size:32px;margin:22px 0 12px}
.card{background:#1c1c1c;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:12px}
.card img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#333}
.card-info{flex:1}
.card-info b{font-size:17px}
.card-info p{font-size:13px;color:#aaa;margin-top:3px}
.price{font-weight:900;font-size:18px}
.add{background:#fff;color:#000;border:0;border-radius:999px;padding:10px 16px;font-weight:900;cursor:pointer}
.cart-bar{position:fixed;left:12px;right:12px;bottom:12px;background:#fff;color:#000;border-radius:16px;padding:14px}
.cart-bar button{width:100%;background:#000;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}
input,select{width:100%;padding:12px;border-radius:10px;border:0;background:#2a2a2a;color:#fff;margin-top:8px}
.note{background:#1c1c1c;border:1px solid #333;padding:12px;border-radius:12px;font-size:13px;color:#ccc;margin-top:16px;line-height:1.5}
.hide{display:none}
</style>
</head>
<body>
<header><h1>CARNE</h1><div class="sub">Hamburguesas · La Plata</div></header>

<div id="menu">
<h2>Combos</h2>
<div id="list"></div>
<div class="note">📍 <b>Solo retiro por el local:</b> 4 y esquina 50, La Plata.<br>💳 <b>Se abona al retirar</b> con efectivo, tarjeta de crédito o débito.<br>No contamos con delivery propio.</div>
</div>

<div id="cartView" class="hide">
<h2>Tu pedido</h2>
<div id="cartList"></div>
<label>Nombre</label><input id="nombre" placeholder="Tu nombre">
<label>Horario de retiro</label><select id="horario"><option>Lo antes posible</option><option>En 30 min</option><option>En 1 hora</option><option>Esta noche</option></select>
<div class="note">📍 Retiro: 4 y 50, La Plata<br>💳 Abonás al retirar con efectivo, crédito o débito.</div>
</div>

<div class="cart-bar">
<div><b id="totalText">Carrito vacío</b></div>
<button id="mainBtn" onclick="toggleCart()">Ver carrito</button>
</div>

<script>
const WHATSAPP = "5492210000000"; // <-- CAMBIAR POR EL NUMERO REAL DE CARNE
const productos = [
 {id:1,nombre:"Caja Mundialista",desc:"Hamburguesa + papas + gaseosa",precio:80000,img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200"},
 {id:2,nombre:"Combo ChoriBurguer",desc:"Choripán burguer + papas",precio:15000,img:"https://images.unsplash.com/photo-1550547660-d9450f859349?w=200"},
 {id:3,nombre:"CARNE Simple",desc:"Medallón 120g, cheddar, pan brioche",precio:12000,img:"https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=200"},
 {id:4,nombre:"CARNE Doble",desc:"Doble medallón, doble cheddar, bacon",precio:18000,img:"https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=200"},
 {id:5,nombre:"Papas CARNE",desc:"Papas con cheddar y verdeo",precio:9000,img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=200"},
];
let cart = {};
function render(){
 document.getElementById('list').innerHTML = productos.map(p=>`
  <div class="card"><img src="${p.img}"><div class="card-info"><b>${p.nombre}</b><p>${p.desc}</p><div class="price">$${p.precio.toLocaleString('es-AR')}</div></div><button class="add" onclick="add(${p.id})">+ Agregar</button></div>`).join('');
 let total=0, count=0;
 for(let id in cart){ let p=productos.find(x=>x.id==id); total+=p.precio*cart[id]; count+=cart[id]; }
 document.getElementById('totalText').innerText = count? `${count} productos · Total $${total.toLocaleString('es-AR')}` : "Carrito vacío";
 document.getElementById('cartList').innerHTML = Object.keys(cart).length? Object.keys(cart).map(id=>{let p=productos.find(x=>x.id==id); return `<div class="card"><div class="card-info"><b>${p.nombre}</b><p>${cart[id]} x $${p.precio.toLocaleString('es-AR')}</p></div><button class="add" onclick="change(${id},-1)">-</button><b>${cart[id]}</b><button class="add" onclick="change(${id},1)">+</button></div>`}).join('') : "<p>Tu carrito está vacío</p>";
}
function add(id){ cart[id]=(cart[id]||0)+1; render(); }
function change(id,d){ cart[id]+=d; if(cart[id]<=0) delete cart[id]; render(); }
let showingCart=false;
function toggleCart(){
 if(!showingCart){ document.getElementById('menu').classList.add('hide'); document.getElementById('cartView').classList.remove('hide'); document.getElementById('mainBtn').innerText="Enviar pedido por WhatsApp"; showingCart=true; }
 else{
  let nombre=document.getElementById('nombre').value||"Sin nombre";
  let horario=document.getElementById('horario').value;
  let msg=`Hola CARNE! Soy ${nombre}%0AQuiero retirar en 4 y 50 - ${horario}%0A%0A*PEDIDO:*%0A`;
  for(let id in cart){let p=productos.find(x=>x.id==id); msg+=`- ${cart[id]}x ${p.nombre} $${(p.precio*cart[id]).toLocaleString('es-AR')}%0A`;}
  let total=Object.keys(cart).reduce((s,id)=>s+productos.find(x=>x.id==id).precio*cart[id],0);
  msg+=`%0A*Total: $${total.toLocaleString('es-AR')}*%0AAbono al retirar con efectivo / crédito / débito.`;
  window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,'_blank');
 }
}
render();
</script>
</body>
</html>
